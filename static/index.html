<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova</title>
<style>
  :root{
    --bg1:#0b0f2a; --bg2:#1a1145; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
    --text:#eef0ff; --muted:#9aa0c8; --a:#7c5cff; --b:#22d3ee; --c:#ff6bd6;
  }
  *{box-sizing:border-box;margin:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    min-height:100vh;height:100vh;overflow:hidden;
    background:radial-gradient(1200px 600px at 10% -10%,#2b1b6b 0%,transparent 60%),
               radial-gradient(900px 500px at 100% 110%,#0b4a6b 0%,transparent 55%),
               linear-gradient(160deg,var(--bg1),var(--bg2));
  }
  /* floating stars */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.5;animation:tw 4s infinite ease-in-out}
  @keyframes tw{50%{opacity:.05;transform:scale(.6)}}

  /* ---------- robot ---------- */
  .robot{width:100%;height:100%;overflow:visible}
  .robot .float{animation:float 3s ease-in-out infinite;transform-origin:center}
  @keyframes float{50%{transform:translateY(-6px)}}
  .eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .arm{transform-box:fill-box;transform-origin:10% 90%}
  .wave .arm{animation:wave .5s ease-in-out infinite alternate}
  @keyframes wave{from{transform:rotate(-15deg)}to{transform:rotate(35deg)}}
  .mouth{transform-box:fill-box;transform-origin:center}
  body.talking .mouth{animation:talk .22s ease-in-out infinite alternate}
  @keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.6)}}
  .antenna-dot{animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.3}}

  /* ---------- welcome overlay ---------- */
  #welcome{
    position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(800px 500px at 50% 40%,rgba(124,92,255,.25),transparent 70%),rgba(8,10,30,.92);
    backdrop-filter:blur(8px);transition:opacity .6s,visibility .6s;text-align:center;padding:20px;
  }
  #welcome.hide{opacity:0;visibility:hidden}
  #welcome .big{width:min(260px,55vw);height:min(260px,55vw)}
  #welcome h1{font-size:clamp(28px,6vw,44px);background:linear-gradient(90deg,var(--b),var(--a),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
  #welcome p{color:var(--muted);max-width:420px}
  #bubble{
    background:var(--card);border:1px solid var(--line);padding:10px 18px;border-radius:18px;min-height:42px;
    opacity:0;transform:translateY(6px);transition:.4s;font-size:17px
  }
  #bubble.show{opacity:1;transform:none}
  .btn{
    border:0;cursor:pointer;color:#fff;font-weight:600;font-size:16px;padding:14px 28px;border-radius:999px;
    background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 10px 30px rgba(124,92,255,.45);transition:transform .15s;
  }
  .btn:hover{transform:translateY(-2px) scale(1.03)}

  /* ---------- app layout ---------- */
  #app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;max-width:900px;margin:0 auto;padding:12px 14px}
  header{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);border-radius:20px}
  header .mini{width:48px;height:48px;flex:none}
  header h2{font-size:18px}
  header small{color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}
  header .tools{margin-left:auto;display:flex;gap:8px}
  .icon{border:1px solid var(--line);background:var(--card);color:var(--text);width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:17px;transition:.15s}
  .icon:hover{background:rgba(255,255,255,.14)}
  .icon.off{opacity:.45}

  #chat{flex:1;overflow-y:auto;padding:18px 4px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
  #chat::-webkit-scrollbar{width:8px}#chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:8px}
  .row{display:flex;gap:10px;animation:in .3s ease both;max-width:100%}
  @keyframes in{from{opacity:0;transform:translateY(8px)}}
  .row.user{justify-content:flex-end}
  .av{width:34px;height:34px;flex:none;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
  .msg{padding:12px 16px;border-radius:18px;line-height:1.55;max-width:min(680px,86%);word-wrap:break-word}
  .row.bot .msg{background:var(--card);border:1px solid var(--line);border-top-left-radius:6px}
  .row.user .msg{background:linear-gradient(135deg,var(--a),#4f46e5);border-top-right-radius:6px;box-shadow:0 8px 24px rgba(79,70,229,.35)}
  .msg a{color:var(--b)}
  .msg code{background:rgba(0,0,0,.35);padding:1px 6px;border-radius:6px}
  .imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
  .imgcard{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;background:linear-gradient(110deg,#1b1f4a 30%,#2c3170 50%,#1b1f4a 70%);background-size:200% 100%;animation:sh 1.4s infinite}
  .imgcard.done{animation:none}
  @keyframes sh{to{background-position:-200% 0}}
  .imgcard img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s}
  .imgcard.done img{opacity:1}
  .imgcard a.dl{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;text-decoration:none;padding:5px 10px;border-radius:10px;font-size:12px}
  .imgcard .cap{position:absolute;inset:auto 0 0 0;padding:6px 10px;font-size:11px;color:#cfd3ff;display:none}
  .srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .srcs a{font-size:12px;text-decoration:none;color:var(--text);border:1px solid var(--line);background:rgba(255,255,255,.05);padding:4px 10px;border-radius:999px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srcs a:hover{background:rgba(124,92,255,.3)}
  .typing span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--b);animation:bounce 1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}

  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:4px 2px 10px}
  .chip{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:999px;font-size:13.5px;transition:.15s}
  .chip:hover{background:rgba(124,92,255,.3);transform:translateY(-1px)}

  form{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);border-radius:22px}
  form input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font-size:16px;padding:10px 12px}
  form input::placeholder{color:var(--muted)}
  .send{border:0;cursor:pointer;width:44px;height:44px;border-radius:50%;color:#fff;font-size:18px;background:linear-gradient(135deg,var(--a),var(--b))}
  .send:disabled{opacity:.5;cursor:default}
  .mic.rec{background:#ef4444;border-color:#ef4444;animation:pulse 1s infinite}
  @media(max-width:520px){header small{display:none}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<!-- Welcome screen: the robot greets you by voice -->
<div id="welcome">
  <div class="big" id="bigRobot"></div>
  <div id="bubble"></div>
  <h1>Meet Nova</h1>
  <p>Your AI robot friend. Ask me anything and I will search the web, or tell me to draw something.</p>
  <button class="btn" id="wake">Tap to wake up Nova</button>
</div>

<div id="app">
  <header>
    <div class="mini" id="miniRobot"></div>
    <div><h2>Nova</h2><small><span class="dot"></span> online · web search · image studio</small></div>
    <div class="tools">
      <button class="icon" id="voiceBtn" title="Toggle voice replies">🔊</button>
      <button class="icon" id="clearBtn" title="New chat">✨</button>
    </div>
  </header>

  <div id="chat"></div>

  <div class="chips" id="chips">
    <button class="chip">🌐 Latest AI news today</button>
    <button class="chip">🎨 Draw a robot astronaut on Mars</button>
    <button class="chip">📚 What is RAG in AI?</button>
    <button class="chip">🏏 Who won the last cricket match?</button>
  </div>

  <form id="form">
    <button type="button" class="icon mic" id="mic" title="Speak">🎤</button>
    <input id="input" placeholder="Ask Nova anything, or say 'draw a dragon'…" autocomplete="off">
    <button class="send" id="send" title="Send">➤</button>
  </form>
</div>

<script>
const $ = s => document.querySelector(s);
const sid = (crypto.randomUUID && crypto.randomUUID()) || String(Math.random()).slice(2);
let voiceOn = true;

/* ---------- stars ---------- */
for (let i = 0; i < 40; i++) {
  const s = document.createElement('i');
  s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
  s.style.animationDelay = (Math.random() * 4) + 's';
  $('#stars').appendChild(s);
}

/* ---------- robot SVG ---------- */
function robotSVG(id) {
  return `<svg class="robot" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hg${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9ecff"/><stop offset="1" stop-color="#9aa6ff"/></linearGradient>
    <linearGradient id="bg${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  </defs>
  <g class="float">
    <line x1="100" y1="22" x2="100" y2="40" stroke="#c9ceff" stroke-width="4" stroke-linecap="round"/>
    <circle class="antenna-dot" cx="100" cy="16" r="8" fill="#ff6bd6"/>
    <rect x="42" y="40" width="116" height="86" rx="30" fill="url(#hg${id})"/>
    <rect x="56" y="56" width="88" height="54" rx="22" fill="#12163d"/>
    <ellipse class="eye" cx="80" cy="80" rx="9" ry="11" fill="#22d3ee"/>
    <ellipse class="eye" cx="120" cy="80" rx="9" ry="11" fill="#22d3ee"/>
    <rect class="mouth" x="88" y="97" width="24" height="7" rx="3.5" fill="#ff6bd6"/>
    <circle cx="66" cy="98" r="5" fill="#ff6bd6" opacity=".35"/><circle cx="134" cy="98" r="5" fill="#ff6bd6" opacity=".35"/>
    <rect x="34" y="68" width="10" height="26" rx="5" fill="#9aa6ff"/><rect x="156" y="68" width="10" height="26" rx="5" fill="#9aa6ff"/>
    <rect x="62" y="132" width="76" height="62" rx="22" fill="url(#bg${id})"/>
    <circle cx="100" cy="162" r="9" fill="#fff" opacity=".85"/>
    <rect x="40" y="140" width="22" height="12" rx="6" fill="#9aa6ff"/>
    <rect class="arm" x="138" y="116" width="40" height="13" rx="6.5" fill="#9aa6ff"/>
    <rect x="72" y="194" width="20" height="14" rx="7" fill="#9aa6ff"/><rect x="108" y="194" width="20" height="14" rx="7" fill="#9aa6ff"/>
  </g></svg>`;
}
$('#bigRobot').innerHTML = robotSVG('a');
$('#miniRobot').innerHTML = robotSVG('b');

/* ---------- voice (text to speech) ---------- */
let voices = [];
function loadVoices() { voices = speechSynthesis.getVoices(); }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

function speak(text, onend) {
  if (!('speechSynthesis' in window)) { onend && onend(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = voices.find(v => /en-IN/i.test(v.lang)) || voices.find(v => /en-(US|GB)/i.test(v.lang)) || voices[0];
  if (v) u.voice = v;
  u.pitch = 1.3; u.rate = 1.03;
  u.onstart = () => document.body.classList.add('talking');
  const done = () => { document.body.classList.remove('talking'); onend && onend(); };
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}

/* ---------- welcome ---------- */
$('#wake').onclick = () => {
  const text = "Hi! Welcome! I'm Nova, your little robot assistant. Ask me anything, or tell me to draw something.";
  $('#wake').style.display = 'none';
  $('#welcome').classList.add('wave');
  $('#bubble').textContent = "👋 Hi! Welcome! I'm Nova!";
  $('#bubble').classList.add('show');
  speak(text, () => setTimeout(() => {
    $('#welcome').classList.add('hide'); $('#welcome').classList.remove('wave');
    $('#input').focus();
  }, 500));
  // fallback if the browser has no speech support
  if (!('speechSynthesis' in window)) setTimeout(() => $('#welcome').classList.add('hide'), 2500);
};
addBot("Hi there! 👋 I'm **Nova**. I can search the web for fresh answers and generate AI images. Try the suggestions below!");

/* ---------- rendering ---------- */
function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function md(s) {
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/^\s*[-*] (.*)$/gm, '• $1');
  return s.replace(/\n/g, '<br>');
}
function scrollDown() { const c = $('#chat'); c.scrollTop = c.scrollHeight; }

function addUser(text) {
  const r = document.createElement('div'); r.className = 'row user';
  r.innerHTML = `<div class="msg">${esc(text)}</div>`;
  $('#chat').appendChild(r); scrollDown();
}
function addBot(text, images = [], sources = []) {
  const r = document.createElement('div'); r.className = 'row bot';
  let html = `<div class="av"><div style="width:30px;height:30px">${robotSVG('m' + Math.random().toString(36).slice(2, 6))}</div></div><div class="msg">${md(text)}`;
  if (images.length) {
    html += '<div class="imgs">' + images.map(im => `
      <div class="imgcard"><img src="${im.url}" alt="${esc(im.prompt)}"
        onload="this.parentNode.classList.add('done')"
        onerror="this.parentNode.classList.add('done');this.alt='Image failed to load. Try again.'">
        <a class="dl" href="${im.url}" target="_blank" rel="noopener">Open ↗</a></div>`).join('') + '</div>';
  }
  if (sources.length) {
    html += '<div class="srcs">' + sources.map(s => `<a href="${s.url}" target="_blank" rel="noopener" title="${esc(s.title)}">🔗 ${esc(s.title || s.url)}</a>`).join('') + '</div>';
  }
  r.innerHTML = html + '</div>';
  $('#chat').appendChild(r); scrollDown();
}
function showTyping() {
  const r = document.createElement('div'); r.className = 'row bot'; r.id = 'typing';
  r.innerHTML = '<div class="av">🤖</div><div class="msg typing"><span></span><span></span><span></span></div>';
  $('#chat').appendChild(r); scrollDown();
}
function hideTyping() { const t = $('#typing'); t && t.remove(); }

/* ---------- chat ---------- */
async function send(text) {
  text = text.trim(); if (!text) return;
  $('#chips').style.display = 'none';
  addUser(text); $('#input').value = ''; $('#send').disabled = true; showTyping();
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sid, message: text})
    });
    const d = await r.json();
    hideTyping();
    if (!r.ok) { addBot('⚠️ ' + (d.detail || 'Server error')); }
    else {
      addBot(d.answer, d.images, d.sources);
      if (voiceOn) {
        const plain = d.answer.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/https?:\/\/\S+/g, '').replace(/[*`#_]/g, '');
        speak(plain.slice(0, 320));
      }
    }
  } catch (e) { hideTyping(); addBot('⚠️ Could not reach the server. Is it running?'); }
  $('#send').disabled = false; $('#input').focus();
}
$('#form').onsubmit = e => { e.preventDefault(); send($('#input').value); };
document.querySelectorAll('.chip').forEach(c => c.onclick = () => send(c.textContent.replace(/^\S+\s/, '')));

$('#voiceBtn').onclick = () => {
  voiceOn = !voiceOn; $('#voiceBtn').classList.toggle('off', !voiceOn);
  $('#voiceBtn').textContent = voiceOn ? '🔊' : '🔇';
  if (!voiceOn) { speechSynthesis.cancel(); document.body.classList.remove('talking'); }
};
$('#clearBtn').onclick = () => location.reload();

/* ---------- mic (speech to text) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) { $('#mic').style.display = 'none'; }
else {
  const rec = new SR(); rec.lang = 'en-IN'; rec.interimResults = false;
  rec.onresult = e => send(e.results[0][0].transcript);
  rec.onend = () => $('#mic').classList.remove('rec');
  $('#mic').onclick = () => { speechSynthesis.cancel(); $('#mic').classList.add('rec'); rec.start(); };
}
</script>
</body>
</html>
